# GateMoE default configuration.
# Target: Raspberry Pi 5 (8 GB), Pi-only, fully offline, models + data on a 1 TB USB HDD.
# Override any key with your own YAML file:  GATEMOE_CONFIG=/path/to/my.yaml gatemoe serve
# Values may reference other keys with ${section.key}.

paths:
  data_dir: /mnt/hdd/gatemoe                  # 1 TB USB HDD mount point
  models_dir: ${paths.data_dir}/models        # GGUF + ONNX files
  zim_dir: ${paths.data_dir}/zim              # Kiwix .zim files (offline knowledge)
  jobs_dir: ${paths.data_dir}/jobs            # one folder per generated lesson
  cache_dir: ${paths.data_dir}/cache          # router memo cache, TTS cache
  llama_server: ${paths.data_dir}/llama.cpp/build/bin/llama-server
  hyperframes_dir: ${paths.data_dir}/hyperframes   # npm project containing node_modules/hyperframes
  chrome: /usr/bin/chromium                   # browser used by HyperFrames (Debian chromium on the Pi)
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  dot: dot                 # Graphviz, for concept maps (apt install graphviz)
  node: node
  python: null                                # interpreter for the Manim subprocess (null = current)

hardware:
  threads: 4                                  # Pi 5 has 4 Cortex-A76 cores

llama:
  host: 127.0.0.1
  extra_args: []                              # x86 CPUs with AMX need ["-nr"] (weight-repack bug)
  ready_timeout_s: 1200                       # cold load of 5.6 GB: ~1 min from a USB HDD, much longer from a slow SD card
  stop_timeout_s: 20
  auto_no_repack: true                        # add -nr on CPUs with Intel AMX (llama.cpp repack crash; cloud VMs)
  lock_timeout_s: 900                         # a 2nd GateMoE process (CLI next to `serve`) waits this long for the model slot

# Only ONE big model is resident at a time (8 GB RAM). The manager swaps them.
models:
  router:
    kind: decision                            # Clef-flash: serves POST /v1/systemone only
    file: Cloudflare_clef-flash-Q4_0.gguf     # Q4_0 gets the fast 4x4 dotprod repack on Cortex-A76
    port: 8082
    ctx: 2048                                 # whole prompt must fit in one ubatch (-b/-ub = ctx)
    args: ["-np", "1"]
    request_timeout_s: 900
  generator:
    kind: chat
    file: Qwen3.5-4B-Q4_0.gguf
    port: 8081
    ctx: 8192
    # --reasoning off: Qwen3.5 thinks by default (+300 tokens per answer). --cache-ram 0 and
    # --ctx-checkpoints 4 keep RSS ~3.3 GB while prefix reuse across gateways still works.
    args: ["-np", "1", "--jinja", "--reasoning", "off", "--cache-ram", "0", "--ctx-checkpoints", "4"]
    request_timeout_s: 3600
    temperature: 0.4
    # Qwen3.5 "thinking" is switched off per request (chat_template_kwargs.enable_thinking=false).
    disable_thinking: true
    # Constrain output with GateMoE's own GBNF (no indentation/newlines between JSON tokens) instead of
    # llama-server's json_schema conversion, which lets the model pretty-print. See research/genbench.
    compact_json: true          # measured (x86): -42 % generation time (English lesson), -18 % (Kannada)

router:
  mode: clef               # clef = Clef-flash decides; all = every gateway (baseline); manual = user picks
  threshold: 0.5           # a gateway fires when P(yes) >= threshold
  memo_cache: true         # identical (request, schema, model) -> reuse decision (exact match only)
  min_gateways: [notes]    # if nothing fires, run these
  in_scope_min: 0.2        # below this the request is not a technical/scientific learning request: stop early
                           # (measured: off-topic ~0.007; English in-scope 0.90-0.97, a Kannada one only 0.60)
  max_state_chars: 600     # learner text sent to Clef (prompt must fit one 2048-token micro-batch)
  # Compact schema: every token here is re-read on every call (Clef keeps no KV cache).
  gateways:
    notes: "Make written study notes?"
    flashcards: "Make flashcards?"
    quiz: "Make a quiz?"
    podcast: "Make an audio podcast?"
    video: "Make an animated video?"
    code: "Make code examples?"
  subjects: [physics, chemistry, biology, mathematics, computer_science, electronics, electrical_engineering,
             mechanical_engineering, civil_engineering, earth_science, other]
  levels: [beginner, intermediate, advanced]
  video_engines:
    manim: "equations, graphs, geometry, algorithms"
    hyperframes: "text, timelines, processes, charts, code"

knowledge:
  enabled: true
  max_articles: 6          # articles fetched per query set
  max_passages: 5          # passages packed into the generator prompt
  passage_words: 200
  max_source_chars: 6000   # hard cap on SOURCES text (keeps Pi prefill time bounded)
  include_english: true    # also search English ZIMs for non-English requests

simulations:               # PhET interactive simulations from phet_<lang>_all ZIMs (title matching, no LLM)
  enabled: true
  max_results: 3
  min_score: 0.5           # share of a sim title's distinctive words the lesson mentions

concept_map:               # Graphviz rendering of the notes' concept links
  png_dpi: 150
  timeout_s: 60
  cpu_seconds: 30

generation:
  flashcards: 8
  quiz_questions: 5
  podcast_turns: 10
  video_beats: 6
  concept_map: true         # notes include concept links, drawn by Graphviz (`dot`)
  max_tokens:
    plan: 400
    notes: 1100
    flashcards: 900
    quiz: 1200
    podcast: 1400
    code: 1000
    video: 1400

speech:
  models_dir: ${paths.models_dir}/speech   # supertonic3/ mms/ piper/ sherpa/ (scripts/fetch_speech_models.sh)
  steps: 5                 # Supertonic flow steps: 5 -> ~3.5% WER; 2 steps was 32% WER in our tests
  speed: 1.0
  threads: 4               # TTS runs only after the LLM is unloaded (4 threads under contention is slower than 2)
  voices: {A: F2, B: M1}   # Supertonic hosts; single-voice engines pitch-shift host B by 3 semitones
  supertonic_variant: fp32 # or int8 (k2-fsa quantised vector estimator + vocoder, -254 MB)
  format: mp3
  bitrate: 64k

video:
  enabled_engines: [manim, hyperframes]   # router's video_engine picks one; the other is the fallback
  width: 1280
  height: 720
  fps: 24
  tail_pad_s: 0.4          # silence after each beat's narration
  max_repairs: 3           # invalid beats sent back to the generator once (while it is still loaded)
  # HyperFrames (Chromium) per-beat limits
  render_timeout_s: 600
  sandbox_cpu_seconds: 900
  # Manim: one sandboxed batch process per lesson (prlimit CPU / address space / file size)
  manim_cpu_s_per_beat: 90
  manim_as_mb: 2048        # >= 1024 MB measured minimum

handout:
  enabled: true            # printable PDF (notes, glossary, flashcards, quiz + answer key) via Typst

server:
  host: 0.0.0.0
  port: 8000
  max_pending_jobs: 20       # queued + running lessons accepted at once (HTTP 429 beyond)
  auth:                      # optional login (HTTP Basic) - set a password when the server is reachable
    user: gatemoe            # from the internet (env GATEMOE_PASSWORD / GATEMOE_USER)
    password: ""
  allowed_hosts: []          # extra Host names; IP addresses, localhost, *.local and this machine's
                             # hostname are always allowed (blocks DNS-rebinding from web pages)
