gu: {name: Gujarati, native: ગુજરાતી, iso3: guj, tts: mms, font: "Noto Sans Gujarati"}
pa: {name: Punjabi, native: ਪੰਜਾਬੀ, iso3: pan, tts: mms, font: "Noto Sans Gurmukhi"}
es: {name: Spanish, native: Español, iso3: spa, tts: supertonic, font: "Noto Sans"}
fr: {name: French, native: Français, iso3: fra, tts: supertonic, font: "Noto Sans"}
