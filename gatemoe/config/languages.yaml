# Language registry: one entry per learner language.
#   tts:   which offline voice engine speaks it (informational; the speech gateway routes by
#          gateways/speech/podcast.py ENGINE_TABLE and uses the first installed candidate):
#          supertonic = Supertonic 3 (31 languages, 10 voices, two real hosts)
#          mms        = Meta MMS VITS exported to ONNX (one voice; host B pitch-shifted; CC-BY-NC)
#          piper      = Piper voices via piper-tts (te, ml, mr, bn)
#          sherpa     = sherpa-onnx (zh)
#   font:  font family used for on-screen text (Manim / HyperFrames)
#   iso3:  ISO 639-3 code as stored in Kiwix ZIM metadata ("Language")
en: {name: English, native: English, iso3: eng, tts: supertonic, font: "Noto Sans"}
hi: {name: Hindi, native: हिन्दी, iso3: hin, tts: supertonic, font: "Noto Sans Devanagari"}
kn: {name: Kannada, native: ಕನ್ನಡ, iso3: kan, tts: mms, font: "Noto Sans Kannada"}
ta: {name: Tamil, native: தமிழ், iso3: tam, tts: mms, font: "Noto Sans Tamil"}
te: {name: Telugu, native: తెలుగు, iso3: tel, tts: piper, font: "Noto Sans Telugu"}
bn: {name: Bengali, native: বাংলা, iso3: ben, tts: piper, font: "Noto Sans Bengali"}
mr: {name: Marathi, native: मराठी, iso3: mar, tts: piper, font: "Noto Sans Devanagari"}
