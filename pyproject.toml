[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatemoe"
version = "0.1.0"
description = "Offline, router-orchestrated learning-content generator for the Raspberry Pi 5 (hierarchical model routing with a Clef-flash decision model)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "onnxruntime>=1.19",
  "libzim>=3.4",
  "py3langid>=0.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
video = ["manim[typst]>=0.21"]
speech-extra = ["sherpa-onnx>=1.12"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gatemoe = "gatemoe.cli:main"

[tool.setuptools.packages.find]
include = ["gatemoe*"]

[tool.setuptools.package-data]
gatemoe = ["server/static/*", "gateways/video/hf_templates/*", "gateways/video/hf_templates/**/*", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
